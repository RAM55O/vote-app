<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Java & SQLite To-Do App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-left">
                <div class="logo-icon">✓</div>
                <div>
                    <h1>TaskFlow</h1>
                    <p class="subtitle">Java REST + SQLite Full-Stack App</p>
                </div>
            </div>
            <div class="header-stats">
                <div class="stat-badge">
                    <span class="stat-number" id="total-count">0</span>
                    <span class="stat-label">Total</span>
                </div>
                <div class="stat-badge stat-pending">
                    <span class="stat-number" id="pending-count">0</span>
                    <span class="stat-label">Pending</span>
                </div>
                <div class="stat-badge stat-completed">
                    <span class="stat-number" id="completed-count">0</span>
                    <span class="stat-label">Completed</span>
                </div>
            </div>
        </header>

        <!-- Main Card: Create Todo -->
        <section class="card create-card">
            <h2 class="card-title">Add New Task</h2>
            <form id="todo-form" class="todo-form">
                <div class="form-row">
                    <div class="form-group flex-2">
                        <label for="todo-title">Task Title *</label>
                        <input type="text" id="todo-title" placeholder="What needs to be done?" required autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label for="todo-priority">Priority</label>
                        <select id="todo-priority">
                            <option value="LOW">Low</option>
                            <option value="MEDIUM" selected>Medium</option>
                            <option value="HIGH">High</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="todo-due-date">Due Date</label>
                        <input type="date" id="todo-due-date">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group flex-1">
                        <label for="todo-desc">Description (Optional)</label>
                        <input type="text" id="todo-desc" placeholder="Add extra details, links, or notes..." autocomplete="off">
                    </div>
                    <button type="submit" class="btn btn-primary" id="add-btn">
                        <span class="btn-icon">+</span> Add Task
                    </button>
                </div>
            </form>
        </section>

        <!-- Filter & Search Toolbar -->
        <section class="toolbar">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" placeholder="Search tasks by title or notes...">
                <button id="clear-search" class="clear-btn" style="display: none;">✕</button>
            </div>
            <div class="filter-group">
                <button class="filter-tab active" data-filter="all">All</button>
                <button class="filter-tab" data-filter="active">Active</button>
                <button class="filter-tab" data-filter="completed">Completed</button>
            </div>
        </section>

        <!-- Todo List -->
        <main class="card list-card">
            <div id="todo-list" class="todo-list">
                <!-- Dynamically populated by JS -->
            </div>
            <div id="empty-state" class="empty-state" style="display: none;">
                <div class="empty-icon">📝</div>
                <h3>No tasks found</h3>
                <p>Add a new task above to get started, or adjust your search filter.</p>
            </div>
        </main>
    </div>

    <!-- Edit Task Modal -->
    <div id="edit-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Task</h2>
                <button class="modal-close" id="close-modal-btn">&times;</button>
            </div>
            <form id="edit-form" class="modal-form">
                <input type="hidden" id="edit-id">
                <div class="form-group">
                    <label for="edit-title">Task Title *</label>
                    <input type="text" id="edit-title" required>
                </div>
                <div class="form-group">
                    <label for="edit-desc">Description</label>
                    <textarea id="edit-desc" rows="3" placeholder="Add more details..."></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group flex-1">
                        <label for="edit-priority">Priority</label>
                        <select id="edit-priority">
                            <option value="LOW">Low</option>
                            <option value="MEDIUM">Medium</option>
                            <option value="HIGH">High</option>
                        </select>
                    </div>
                    <div class="form-group flex-1">
                        <label for="edit-due-date">Due Date</label>
                        <input type="date" id="edit-due-date">
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancel-modal-btn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="app.js"></script>
</body>
</html>
